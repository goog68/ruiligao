<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一句话设计 · 3D 与 CAD 出图 | 瑞利高展示科技</title>
<style>
  :root{
    --bg:#eaeff4; --card:#fff; --ink:#0f172a; --sub:#64748b; --line:#dce4ec;
    --accent:#0d9488; --accent2:#0f766e; --soft:#f4f8fa;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:20px;padding:11px 16px;background:#fff;
    border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:206px}
  .logo{
    width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0d9488,#0ea5a0);
    color:#fff;display:grid;place-items:center;font-weight:700;font-size:11.5px;letter-spacing:.5px;
  }
  .brand h1{margin:0;font-size:14px;font-weight:650;letter-spacing:.2px}
  .brand p{margin:1px 0 0;font-size:10.5px;color:var(--sub)}
  .composer{flex:1;display:flex;gap:10px}
  #q{
    flex:1;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);
    font-size:14px;font-family:inherit;color:var(--ink);outline:none;transition:.15s;
  }
  #q:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(13,148,136,.12)}
  #go{
    height:42px;padding:0 22px;border:0;border-radius:10px;background:linear-gradient(135deg,#0d9488,#0f766e);
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
    box-shadow:0 4px 12px rgba(13,148,136,.26);
  }
  #go:hover{filter:brightness(1.05)}
  #go:active{transform:translateY(1px)}
  /* ---------- layout ---------- */
  .layout{
    flex:1;min-height:0;display:grid;grid-template-columns:266px minmax(0,1.02fr) minmax(0,1fr);
    gap:12px;padding:12px 16px 16px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;
    min-height:0;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  .card-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 13px;
    border-bottom:1px solid var(--line);background:linear-gradient(#fff,#fbfdfe);flex:none;
  }
  .card-head h2{margin:0;font-size:12.5px;font-weight:650;letter-spacing:.4px;color:#334155}
  .tag{
    font-size:10.5px;color:var(--sub);background:var(--soft);border:1px solid var(--line);
    border-radius:999px;padding:2px 8px;white-space:nowrap;
  }
  .tools{display:flex;gap:6px}
  .btn{
    height:26px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:7px;
    font-size:11.5px;color:#3f5568;cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent2)}
  .btn.on{background:#e8f7f5;border-color:#9fd8d0;color:var(--accent2);font-weight:600}
  /* ---------- left panel ---------- */
  .panel-body{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
  .block-title{
    font-size:10.5px;letter-spacing:1px;color:#94a3b8;font-weight:650;text-transform:uppercase;
    margin:0 0 7px;
  }
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:10.5px;color:var(--sub)}
  .field input,.field select{
    height:33px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;
    font-family:inherit;font-size:13px;color:var(--ink);outline:none;width:100%;
  }
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.1)}
  .field.wide{grid-column:1 / -1}
  .chips{display:flex;flex-direction:column;gap:6px}
  .chip{
    text-align:left;border:1px dashed #cfdbe6;background:#fbfdfe;border-radius:8px;padding:7px 9px;
    font-size:11.5px;color:#3f5568;cursor:pointer;font-family:inherit;line-height:1.4;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent2);background:#f0fbfa}
  .meta{
    background:linear-gradient(180deg,#f7fbfc,#f0f7f9);border:1px solid #e2edf1;border-radius:9px;
    padding:9px 10px;font-size:11.5px;color:#3d5766;line-height:1.65;
  }
  .meta b{color:var(--accent2);font-weight:650}
  .meta .row{display:flex;justify-content:space-between;gap:8px}
  .meta .row span:last-child{color:#0f172a;font-weight:600}
  /* ---------- 图片识别 ---------- */
  .dz{
    position:relative;min-height:104px;border:1.5px dashed #b9cfdc;border-radius:10px;background:#fbfdfe;
    display:grid;place-items:center;cursor:pointer;overflow:hidden;transition:.16s;text-align:center;padding:10px;
  }
  .dz:hover,.dz.over{border-color:var(--accent);background:#f0fbfa}
  .dz.over{box-shadow:0 0 0 3px rgba(13,148,136,.12)}
  .dz b{display:block;font-size:12.5px;color:#1f3b4a;font-weight:650;margin-top:4px}
  .dz span{display:block;font-size:10.5px;color:#94a3b8;margin-top:2px;line-height:1.35}
  #dzPreview{display:none;width:66px;height:66px;flex:none;object-fit:contain;background:#fff;
    border:1px solid #e2edf1;border-radius:7px}
  .dz.hasimg{display:flex;align-items:center;gap:10px;text-align:left;padding:9px;border-style:solid;border-color:#d7e6ec}
  .dz.hasimg #dzInner{display:none}
  .dz.hasimg #dzPreview{display:block}
  .dz-note{display:none;font-size:10.5px;line-height:1.5;color:#3d5766}
  .dz.hasimg .dz-note{display:block}
  .dz-note em{font-style:normal;color:var(--accent2);font-weight:650}
  /* ---------- viewports ---------- */
  .view-body{flex:1;min-height:0;position:relative}
  #cv3d{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #cv3d:active{cursor:grabbing}
  .cad-wrap{flex:1;min-height:0;padding:6px;display:flex;position:relative}
  #dxfTip{display:none;left:10px;bottom:8px}
  #cadSvg{width:100%;height:100%;display:block}
  .hint{
    position:absolute;left:10px;bottom:8px;font-size:10.5px;color:#94a3b8;pointer-events:none;
    background:rgba(255,255,255,.72);border-radius:6px;padding:2px 7px;
  }
  .cad-wrap{background:#fff}
  @media (max-width:1180px){
    body{overflow:auto}
    .layout{grid-template-columns:1fr;height:auto}
    .card{min-height:340px}
    .view-body{height:380px}
    .cad-wrap{height:420px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">RLG</div>
    <div>
      <h1>一句话设计 · 3D &amp; CAD 出图</h1>
      <p>瑞利高展示科技 · 亚克力精工定制</p>
    </div>
  </div>
  <div class="composer">
    <input id="q" autocomplete="off" placeholder="说一句话，例如：三层亚克力展示架，宽600，深400，高1500">
    <button id="go">生成设计</button>
  </div>
</header>

<main class="layout">
  <!-- 左：参数 -->
  <aside class="card">
    <div class="card-head"><h2>识别与参数</h2><span class="tag" id="typeTag">展示架</span></div>
    <div class="panel-body">
      <div>
        <p class="block-title">丢图出图</p>
        <div class="dz" id="dz">
          <input type="file" id="fileInput" accept="image/*" hidden>
          <div id="dzInner">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path>
              <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
            </svg>
            <b>把产品图丢进来</b>
            <span>自动认层数与高宽比 · 或点此选文件</span>
          </div>
          <img id="dzPreview" alt="">
          <div class="dz-note" id="dzNote"></div>
        </div>
      </div>

      <div>
        <p class="block-title">结构参数（mm）</p>
        <div class="fields">
          <div class="field wide">
            <label>类型</label>
            <select id="pType"></select>
          </div>
          <div class="field"><label>宽 W</label><input id="pW" type="number" min="120" max="6000" step="10"></div>
          <div class="field"><label>深 D</label><input id="pD" type="number" min="100" max="3000" step="10"></div>
          <div class="field"><label>高 H</label><input id="pH" type="number" min="120" max="4000" step="10"></div>
          <div class="field"><label>层数</label><input id="pLayers" type="number" min="1" max="8" step="1"></div>
          <div class="field wide"><label>板厚 t</label><input id="pT" type="number" min="5" max="40" step="1"></div>
        </div>
      </div>

      <div>
        <p class="block-title">一句话示例</p>
        <div class="chips" id="chips"></div>
      </div>

      <div class="meta" id="meta"></div>
    </div>
  </aside>

  <!-- 中：3D -->
  <section class="card">
    <div class="card-head">
      <h2>3D 方案图</h2>
      <div class="tools">
        <button class="btn" id="btnSpin">自动旋转</button>
        <button class="btn" id="btnReset">复位视角</button>
        <button class="btn" id="btnPng">导出 PNG</button>
      </div>
    </div>
    <div class="view-body">
      <canvas id="cv3d"></canvas>
      <div class="hint">拖拽旋转 · 滚轮缩放</div>
    </div>
  </section>

  <!-- 右：CAD -->
  <section class="card">
    <div class="card-head">
      <h2>CAD 工程图</h2>
      <div class="tools">
        <button class="btn" id="btnDxf">导出 DXF</button>
        <button class="btn" id="btnSvg">导出 SVG</button>
        <button class="btn" id="btnPrint">打印</button>
      </div>
    </div>
    <div class="cad-wrap"><div class="hint" id="dxfTip"></div><svg id="cadSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg></div>
  </section>
</main>

<script>
(function(){
"use strict";

/* =========================================================
   1. 基础定义
   ========================================================= */
var TYPES = {
  rack:     {label:'亚克力展示架', code:'RLG-SJ', en:'SHELF', defW:600, defD:400, defH:1500, defL:3},
  cabinet:  {label:'亚克力展柜',   code:'RLG-ZG', en:'CABINET', defW:900, defD:500, defH:1800, defL:3},
  table:    {label:'亚克力展示台', code:'RLG-ST', en:'TABLE', defW:1000, defD:600, defH:900,  defL:1},
  box:      {label:'亚克力陈列盒', code:'RLG-HX', en:'DISPLAY BOX', defW:400, defD:300, defH:250,  defL:3},
  lightbox: {label:'亚克力灯箱',   code:'RLG-DX', en:'LIGHT BOX', defW:800, defD:120, defH:600,  defL:1}
};

var MAT = {
  frame: {c:[203,231,240], a:0.97},
  panel: {c:[221,241,247], a:0.93},
  shelf: {c:[234,249,252], a:0.95},
  glass: {c:[186,224,239], a:0.30},
  light: {c:[255,238,186], a:0.97},
  hidden:{c:[228,244,249], a:0.34}
};

var params = {type:'rack', W:600, D:400, H:1500, layers:3, t:15};
var model = [];

/* =========================================================
   2. 一句话解析
   ========================================================= */
var CN = {一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};

function cn2num(str){
  if(!str) return null;
  if(/^\d+$/.test(str)) return parseInt(str,10);
  if(str === '十') return 10;
  if(str.length === 1) return CN[str] || null;
  var m = str.match(/^([一二三四五六七八九])?十([一二三四五六七八九])?$/);
  if(m) return (m[1] ? CN[m[1]] : 1) * 10 + (m[2] ? CN[m[2]] : 0);
  return null;
}

/* 抓取 “宽600 / 宽600mm / 宽0.6米” 这类写法 */
function grabNum(s, keys){
  for(var i=0;i<keys.length;i++){
    var re = new RegExp(keys[i] + '\\s*(?:为|是|取|:|：|=)?\\s*(\\d+(?:\\.\\d+)?)\\s*(毫米|mm|米|m)?', 'i');
    var m = s.match(re);
    if(m){
      var v = parseFloat(m[1]);
      var u = (m[2] || '').toLowerCase();
      if(u === '米' || u === 'm') v = v * 1000;
      return v;
    }
  }
  return null;
}

function parseSentence(raw){
  var s = String(raw || '');
  var p = {type:'rack', W:null, D:null, H:null, layers:null, t:null, note:[]};

  /* 类型 */
  if(/灯箱|发光字|发光|招牌|logo\s*墙|背光/i.test(s)) p.type = 'lightbox';
  else if(/展柜|陈列柜|玻璃柜|柜子|柜/i.test(s)) p.type = 'cabinet';
  else if(/展示台|陈列台|台子|桌子|桌|台面/i.test(s)) p.type = 'table';
  else if(/陈列盒|收纳盒|盒子|托盘|箱/i.test(s)) p.type = 'box';
  else if(/展示架|展架|陈列架|货架|架子|架/i.test(s)) p.type = 'rack';

  var d = TYPES[p.type];

  /* 三连尺寸 600×400×1500 */
  var tri = s.match(/(\d+(?:\.\d+)?)\s*[×xX*]\s*(\d+(?:\.\d+)?)\s*[×xX*]\s*(\d+(?:\.\d+)?)/);
  if(tri){ p.W = +tri[1]; p.D = +tri[2]; p.H = +tri[3]; p.note.push('三连尺寸 W×D×H'); }

  if(p.W === null) p.W = grabNum(s, ['宽度','宽','W','w']);
  if(p.D === null) p.D = grabNum(s, ['深度','进深','深','D','d']);
  if(p.H === null) p.H = grabNum(s, ['高度','高','H','h']);

  /* 层数 */
  var lm = s.match(/(\d+|[一二两三四五六七八九十]+)\s*层/);
  if(lm){
    var n = cn2num(lm[1]);
    if(n) p.layers = n;
  }
  if(p.layers === null) p.layers = d.defL;

  /* 板厚 */
  var tm = s.match(/(?:板厚|厚度|厚)\s*(?:为|是|:)?\s*(\d+(?:\.\d+)?)\s*(?:毫米|mm)?/i);
  if(tm) p.t = +tm[1];

  /* 兜底 */
  if(p.W === null) p.W = d.defW;
  if(p.D === null) p.D = Math.round(p.W * 0.62 / 10) * 10;
  if(p.H === null) p.H = d.defH;
  if(p.t === null) p.t = 15;

  p.W = clamp(round5(p.W), 120, 6000);
  p.D = clamp(round5(p.D), 80, 3000);
  p.H = clamp(round5(p.H), 100, 4000);
  p.layers = clamp(Math.round(p.layers), 1, 8);
  p.t = clamp(round5(p.t), 5, 40);

  /* 类型相关微调 */
  if(p.type === 'rack' && p.H < 400) p.H = 400;
  if(p.type === 'box' && p.layers > 6) p.layers = 6;

  return p;
}

function round5(v){ return Math.round(v / 5) * 5; }
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }

/* =========================================================
   3. 参数化建模（全部 mm，y 轴向上，底面 y=0）
   ========================================================= */
function box(cx, cy, cz, w, h, d, kind){
  return {x:cx, y:cy, z:cz, w:w, h:h, d:d, kind:kind};
}

function buildRack(p){
  var W=p.W, D=p.D, H=p.H, t=p.t, base=90, out=[];
  out.push(box(0, base/2, 0, W, base, D, 'frame'));                    /* 底座 */
  var sideH = H - base;
  out.push(box(-(W-t)/2, base + sideH/2, 0, t, sideH, D, 'panel'));    /* 左侧板 */
  out.push(box( (W-t)/2, base + sideH/2, 0, t, sideH, D, 'panel'));    /* 右侧板 */
  out.push(box(0, base + sideH/2, -(D-8)/2, W - 2*t, sideH, 8, 'glass')); /* 背板 */
  var n = p.layers, span = sideH - t;
  for(var i=0;i<n;i++){
    var y = base + (n === 1 ? span * 0.55 : i * span / (n - 1)) + t/2;
    out.push(box(0, y, 0, W - 2*t, t, D - 8, 'shelf'));
  }
  return out;
}

function buildCabinet(p){
  var W=p.W, D=p.D, H=p.H, t=p.t, base=120, topT=40, post=32, out=[];
  out.push(box(0, base/2, 0, W, base, D, 'frame'));                    /* 底座 */
  out.push(box(0, H - topT/2, 0, W, topT, D, 'frame'));                /* 顶板 */
  var innerH = H - topT - base, cy = base + innerH/2;
  var px = (W - post)/2, pz = (D - post)/2;
  [[-px,-pz],[px,-pz],[-px,pz],[px,pz]].forEach(function(v){
    out.push(box(v[0], cy, v[1], post, innerH, post, 'frame'));        /* 四立柱 */
  });
  out.push(box(0, cy, -(D-10)/2, W - 2*post, innerH, 20, 'panel'));    /* 背板 */
  out.push(box(-(W-8)/2, cy, 0, 8, innerH, D - 2*post, 'glass'));      /* 左玻璃 */
  out.push(box( (W-8)/2, cy, 0, 8, innerH, D - 2*post, 'glass'));      /* 右玻璃 */
  out.push(box(0, cy, (D-8)/2, W - 2*post, innerH, 8, 'glass'));       /* 前门 */
  var n = p.layers;
  for(var i=1;i<=n;i++){
    out.push(box(0, base + i * innerH/(n+1), 0, W - 2*post - 20, t, D - 2*post - 20, 'hidden'));
  }
  return out;
}

function buildTable(p){
  var W=p.W, D=p.D, H=p.H, t=p.t, top=t*2.6, leg=70, out=[];
  out.push(box(0, H - top/2, 0, W, top, D, 'frame'));                  /* 台面 */
  var lh = H - top;
  [[-(W-leg)/2, -(D-leg)/2],[ (W-leg)/2, -(D-leg)/2],
   [-(W-leg)/2,  (D-leg)/2],[ (W-leg)/2,  (D-leg)/2]].forEach(function(v){
    out.push(box(v[0], lh/2, v[1], leg, lh, leg, 'panel'));            /* 四腿 */
  });
  out.push(box(0, lh*0.42, 0, W - 2*leg - 40, t, D - 2*leg - 40, 'shelf')); /* 下隔板 */
  if(W > 900){
    out.push(box(0, lh*0.42, 0, W - 2*leg - 40, t*2.2, t, 'panel'));   /* 中间加强 */
  }
  return out;
}

function buildBox(p){
  var W=p.W, D=p.D, H=p.H, t=p.t, out=[];
  out.push(box(0, t/2, 0, W, t, D, 'frame'));                          /* 底板 */
  var hh = H - t, cy = t + hh/2;
  out.push(box(-(W-t)/2, cy, 0, t, hh, D, 'panel'));
  out.push(box( (W-t)/2, cy, 0, t, hh, D, 'panel'));
  out.push(box(0, cy, -(D-t)/2, W - 2*t, hh, t, 'panel'));
  out.push(box(0, cy,  (D-t)/2, W - 2*t, hh, t, 'panel'));
  var n = p.layers - 1;
  for(var i=1;i<=n;i++){
    var x = -W/2 + i * W/(n+1);
    out.push(box(x, cy, 0, t, hh, D - 2*t, 'shelf'));                  /* 分格 */
  }
  return out;
}

function buildLightbox(p){
  var W=p.W, D=p.D, H=p.H, f=60, out=[];
  out.push(box(0, f/2, 0, W, f, D, 'frame'));                          /* 下框 */
  out.push(box(0, H - f/2, 0, W, f, D, 'frame'));                      /* 上框 */
  out.push(box(-(W-f)/2, H/2, 0, f, H - 2*f, D, 'frame'));             /* 左框 */
  out.push(box( (W-f)/2, H/2, 0, f, H - 2*f, D, 'frame'));             /* 右框 */
  out.push(box(0, H/2, 0, W - 2*f, H - 2*f, 6, 'light'));              /* 发光面 */
  out.push(box(0, H/2, -(D-8)/2, W - 2*f, H - 2*f, 8, 'panel'));       /* 背板 */
  if(D > 140){
    for(var i=1;i<3;i++){
      out.push(box(-W/2 + i*W/3, H/2, 0, f*0.5, f*0.5, D - 20, 'frame')); /* 加强筋 */
    }
  }
  return out;
}

var BUILDERS = {rack:buildRack, cabinet:buildCabinet, table:buildTable, box:buildBox, lightbox:buildLightbox};

function buildModel(p){
  var fn = BUILDERS[p.type] || buildRack;
  return fn(p);
}

/* =========================================================
   4. 3D 渲染（自研轻量渲染器，无外部依赖）
   ========================================================= */
var cv = document.getElementById('cv3d');
var ctx = cv.getContext('2d');
var view = {yaw:-0.62, pitch:0.30, zoom:1, spin:false};
var rafId = null;

function faceList(boxes){
  var F = [];
  for(var i=0;i<boxes.length;i++){
    var b = boxes[i];
    var x0=b.x-b.w/2, x1=b.x+b.w/2, y0=b.y-b.h/2, y1=b.y+b.h/2, z0=b.z-b.d/2, z1=b.z+b.d/2;
    var v = [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
             [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
    F.push({q:[v[0],v[1],v[2],v[3]], n:[0,0,-1], k:b.kind});
    F.push({q:[v[4],v[5],v[6],v[7]], n:[0,0, 1], k:b.kind});
    F.push({q:[v[0],v[3],v[7],v[4]], n:[-1,0,0], k:b.kind});
    F.push({q:[v[1],v[2],v[6],v[5]], n:[ 1,0,0], k:b.kind});
    F.push({q:[v[0],v[1],v[5],v[4]], n:[0,-1,0], k:b.kind});
    F.push({q:[v[3],v[2],v[6],v[7]], n:[0, 1,0], k:b.kind});
  }
  return F;
}

function niceStep(v){
  if(v < 300) return 50;
  if(v < 800) return 100;
  if(v < 1600) return 200;
  return 400;
}

function render3D(){
  var rect = cv.getBoundingClientRect();
  var w = Math.max(20, Math.round(rect.width));
  var h = Math.max(20, Math.round(rect.height));
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){
    cv.width = Math.round(w*dpr);
    cv.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  var bg = ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#fbfdfe');
  bg.addColorStop(1,'#e5eef5');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,w,h);

  var W = params.W, D = params.D, H = params.H;
  var radius = Math.sqrt(W*W/4 + D*D/4 + H*H/4) || 1;
  var dist = radius * 7.2 / view.zoom;
  var focal = Math.min(w,h) * 3.3;
  var cx = w/2, cy = h*0.49;
  var cosY = Math.cos(view.yaw), sinY = Math.sin(view.yaw);
  var cosP = Math.cos(view.pitch), sinP = Math.sin(view.pitch);

  function proj(x,y,z){
    var py = y - H/2, pz = z;
    var X  = x*cosY - pz*sinY;
    var Z0 = x*sinY + pz*cosY;
    var Y  = py*cosP - Z0*sinP;
    var Z  = py*sinP + Z0*cosP + dist;
    var k  = focal / Math.max(Z, 1);
    return {X: cx + X*k, Y: cy - Y*k, Z: Z};
  }

  /* 地面网格 */
  var step = niceStep(Math.max(W,D));
  var gx = Math.ceil(W/2/step) + 1, gz = Math.ceil(D/2/step) + 1;
  ctx.save();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(122,155,178,0.30)';
  var i, A, B;
  for(i=-gx;i<=gx;i++){
    A = proj(i*step, 0, -gz*step);
    B = proj(i*step, 0,  gz*step);
    ctx.beginPath(); ctx.moveTo(A.X,A.Y); ctx.lineTo(B.X,B.Y); ctx.stroke();
  }
  for(i=-gz;i<=gz;i++){
    A = proj(-gx*step, 0, i*step);
    B = proj( gx*step, 0, i*step);
    ctx.beginPath(); ctx.moveTo(A.X,A.Y); ctx.lineTo(B.X,B.Y); ctx.stroke();
  }
  ctx.restore();

  /* 接触阴影 */
  var c0 = proj(0,0,0);
  ctx.save();
  var rg = ctx.createRadialGradient(c0.X, c0.Y, 2, c0.X, c0.Y, Math.max(W,D)*0.42);
  rg.addColorStop(0,'rgba(40,80,100,0.18)');
  rg.addColorStop(1,'rgba(40,80,100,0)');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.ellipse(c0.X, c0.Y, Math.max(W,D)*0.42, Math.max(W,D)*0.16, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* 面片 */
  var L = [-0.36, 0.74, 0.86];
  var Ln = Math.sqrt(L[0]*L[0]+L[1]*L[1]+L[2]*L[2]);
  L = [L[0]/Ln, L[1]/Ln, L[2]/Ln];

  var fs = faceList(model);
  var list = [];
  for(var f=0; f<fs.length; f++){
    var fc = fs[f];
    var P = [], zsum = 0;
    for(var j=0;j<4;j++){
      var vv = fc.q[j];
      var pp = proj(vv[0], vv[1], vv[2]);
      P.push(pp);
      zsum += pp.Z;
    }
    /* 法线随视角旋转 */
    var nx = fc.n[0], ny = fc.n[1], nz = fc.n[2];
    var rx = nx*cosY - nz*sinY;
    var rz0 = nx*sinY + nz*cosY;
    var ry = ny*cosP - rz0*sinP;
    var rz = ny*sinP + rz0*cosP;
    if(rz <= 0.002) continue;                       /* 背面剔除 */
    var d = Math.max(0, rx*L[0] + ry*L[1] + rz*L[2]);
    var shade = 0.72 + 0.28 * d;
    list.push({P:P, z: zsum/4, k: fc.k, shade: shade, nz: rz});
  }
  list.sort(function(a,b){ return b.z - a.z; });

  for(var m=0; m<list.length; m++){
    var it = list[m];
    var mat = MAT[it.k] || MAT.panel;
    var r = Math.round(mat.c[0]*it.shade);
    var g = Math.round(mat.c[1]*it.shade);
    var b = Math.round(mat.c[2]*it.shade);
    ctx.beginPath();
    ctx.moveTo(it.P[0].X, it.P[0].Y);
    ctx.lineTo(it.P[1].X, it.P[1].Y);
    ctx.lineTo(it.P[2].X, it.P[2].Y);
    ctx.lineTo(it.P[3].X, it.P[3].Y);
    ctx.closePath();
    ctx.globalAlpha = mat.a;
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(26,74,96,0.42)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }
}

function spinLoop(){
  view.yaw += 0.0075;
  render3D();
  rafId = requestAnimationFrame(spinLoop);
}

/* =========================================================
   5. CAD 工程图：先算图元（真实 mm / y 向上 / 第一角法），
      再分别输出 SVG（屏幕看）与 DXF（桌面 CAD 打开）
   ========================================================= */
var NS = 'http://www.w3.org/2000/svg';
var SHEET = null;

function el(tag, attrs, text){
  var n = document.createElementNS(NS, tag);
  if(attrs) for(var k in attrs) n.setAttribute(k, attrs[k]);
  if(text != null) n.textContent = text;
  return n;
}

function buildSheet(){
  var W = params.W, D = params.D, H = params.H;
  var U = Math.max(W, H, D, 200);
  var FS  = U * 0.026;          /* 主字高 */
  var FS2 = FS * 0.80;          /* 标注字高 */
  var gapH = FS * 5.6;
  var gapV = FS * 5.6;
  var THICK = U / 950;
  var THIN  = U / 2400;
  var items = [];

  function addLine(x1,y1,x2,y2,layer,w){
    items.push({t:'line', x1:x1, y1:y1, x2:x2, y2:y2, layer:layer||'THIN', w:w||THIN});
  }
  function addRect(x0,y0,x1,y1,layer,opt){
    opt = opt || {};
    items.push({t:'rect',
      x0:Math.min(x0,x1), y0:Math.min(y0,y1), x1:Math.max(x0,x1), y1:Math.max(y0,y1),
      layer:layer, dash:!!opt.dash, fill:!!opt.fill, w:opt.w||THIN});
  }
  function addText(x,y,h,zh,en,layer,align,rot){
    items.push({t:'text', x:x, y:y, h:h, s:zh, sa:(en==null?zh:en),
      layer:layer||'TEXT', align:align||'center', rot:rot||0});
  }
  function addTri(pts,layer){
    items.push({t:'tri', pts:pts, layer:layer||'DIM'});
  }

  /* ---------- 三视图 ---------- */
  var ox = 0, oy = 0;
  var sideX0 = W + gapH;
  var planY0 = -(D + gapV);
  var LB = {
    front:{zh:'正 视 图', en:'FRONT VIEW'},
    side: {zh:'侧 视 图', en:'SIDE VIEW'},
    plan: {zh:'俯 视 图', en:'TOP VIEW'}
  };

  var KIND_LAYER = {frame:'OUTLINE', panel:'OUTLINE', shelf:'OUTLINE',
                    glass:'GLASS', hidden:'HIDDEN', light:'OUTLINE'};
  var KIND_FILL  = {frame:true, panel:true, shelf:true, light:true, glass:false, hidden:false};

  /* 第一角法：俯视图在主视图下方（物体前面朝上），侧视图在右侧 */
  function drawView(kind){
    var list = model.slice();
    if(kind === 'front') list.sort(function(a,b){ return a.z - b.z; });          /* 近处 z 大，后画 */
    if(kind === 'side')  list.sort(function(a,b){ return b.x - a.x; });          /* 左视图从 -x 看 */
    if(kind === 'plan')  list.sort(function(a,b){ return a.y - b.y; });

    list.forEach(function(b){
      var h0, h1, v0, v1;
      if(kind === 'side'){ h0 = b.z - b.d/2; h1 = b.z + b.d/2; }
      else { h0 = b.x - b.w/2; h1 = b.x + b.w/2; }

      if(kind === 'plan'){ v0 = b.z - b.d/2; v1 = b.z + b.d/2; }
      else { v0 = b.y - b.h/2; v1 = b.y + b.h/2; }

      var x0, x1, y0, y1;
      if(kind === 'front'){
        x0 = ox + (h0 + W/2); x1 = ox + (h1 + W/2);
        y0 = oy + v0;         y1 = oy + v1;
      } else if(kind === 'side'){
        x0 = sideX0 + (D/2 - h1); x1 = sideX0 + (D/2 - h0);   /* 前面在左，靠近主视图 */
        y0 = oy + v0;             y1 = oy + v1;
      } else {
        x0 = ox + (h0 + W/2);     x1 = ox + (h1 + W/2);
        y0 = planY0 + (v0 + D/2); y1 = planY0 + (v1 + D/2);   /* 物体前面朝上（第一角法） */
      }

      addRect(x0, y0, x1, y1, KIND_LAYER[b.kind] || 'THIN', {
        dash: b.kind === 'hidden',
        fill: KIND_FILL[b.kind] !== false,
        w: (b.kind === 'frame' ? THICK : THIN)
      });
    });

    /* 视图名 */
    var lx, ly;
    if(kind === 'front'){ lx = ox + W/2; ly = -(FS*4.6); }
    if(kind === 'side'){  lx = sideX0 + D/2; ly = -(FS*4.6); }
    if(kind === 'plan'){  lx = ox + W/2; ly = planY0 - FS*2.4; }
    addText(lx, ly, FS, LB[kind].zh, LB[kind].en, 'TEXT', 'center');
  }
  function hP(){ return D; }

  drawView('front');
  drawView('side');
  drawView('plan');

  /* ---------- 尺寸标注 ---------- */
  function arrow(x, y, dir, vertical){
    var ah = FS*0.52, aw = FS*0.17;
    if(!vertical) addTri([[x, y], [x + dir*ah, y + aw], [x + dir*ah, y - aw]], 'DIM');
    else          addTri([[x, y], [x + aw, y + dir*ah], [x - aw, y + dir*ah]], 'DIM');
  }

  function dimH(x1, x2, y, label, fromY){
    if(fromY != null){
      addLine(x1, fromY, x1, y, 'DIM', THIN*0.7);
      addLine(x2, fromY, x2, y, 'DIM', THIN*0.7);
    }
    addLine(x1, y, x2, y, 'DIM', THIN*0.9);
    arrow(x1, y, 1);
    arrow(x2, y, -1);
    addText((x1+x2)/2, y + FS*0.95, FS2, label, label, 'DIM', 'center');
  }

  function dimV(y1, y2, x, label, fromX){
    if(fromX != null){
      addLine(fromX, y1, x, y1, 'DIM', THIN*0.7);
      addLine(fromX, y2, x, y2, 'DIM', THIN*0.7);
    }
    addLine(x, y1, x, y2, 'DIM', THIN*0.9);
    arrow(x, y1, 1, true);
    arrow(x, y2, -1, true);
    addText(x - FS*0.95, (y1+y2)/2, FS2, label, label, 'DIM', 'center', 90);
  }

  /* 主视图：总宽 / 总高 */
  dimH(ox, ox + W, -(FS*2.2), String(W), 0);
  dimV(oy, oy + H, -(FS*2.2), String(H), 0);
  /* 侧视图：总深 */
  dimH(sideX0, sideX0 + D, -(FS*2.2), String(D), 0);
  /* 俯视图：总深（右侧） */
  dimV(planY0, planY0 + D, W + FS*2.2, String(D), W);

  /* 层高 */
  var shelves = model.filter(function(b){ return b.kind === 'shelf' || b.kind === 'hidden'; })
    .map(function(b){ return b.y; })
    .sort(function(a,b){ return a - b; });
  if(shelves.length > 1 && shelves.length <= 7){
    var rx = W + FS*3.4;
    for(var i=0;i<shelves.length-1;i++){
      var yA = shelves[i], yB = shelves[i+1];
      if(yA < -1) continue;
      addLine(W, yA, rx + FS*0.3, yA, 'DIM', THIN*0.6);
      addLine(W, yB, rx + FS*0.3, yB, 'DIM', THIN*0.6);
      addLine(rx, yA, rx, yB, 'DIM', THIN*0.8);
      arrow(rx, yA, 1, true);
      arrow(rx, yB, -1, true);
      addText(rx + FS*0.9, (yA+yB)/2, FS2, String(Math.round(yB - yA)),
              String(Math.round(yB - yA)), 'DIM', 'center', 90);
    }
  }

  /* ---------- 标题栏 ---------- */
  var d = TYPES[params.type];
  var tbW = U * 0.42, tbH = U * 0.125;
  var tbX = W + gapH, tbY = planY0;
  addRect(tbX, tbY, tbX + tbW, tbY + tbH, 'FRAME', {w: THICK*0.8});
  [0.25, 0.5, 0.75].forEach(function(f){
    addLine(tbX, tbY + tbH*f, tbX + tbW, tbY + tbH*f, 'FRAME', THIN*0.8);
  });
  addLine(tbX + tbW*0.58, tbY + tbH*0.25, tbX + tbW*0.58, tbY + tbH, 'FRAME', THIN*0.8);

  var today = new Date();
  var dateStr = today.getFullYear() + '-' +
    String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var rowH = tbH*0.25;
  function cell(cx, cy, zh, en, size, bold){
    addText(cx, cy, size, zh, en, 'TEXT', 'left');
  }
  var tx = tbX + tbW*0.035, TS = tbH*0.165;
  cell(tx, tbY + rowH*3.5, '瑞利高展示科技', 'RUILIGAO DISPLAY TECH', TS);
  cell(tx, tbY + rowH*2.5, '图名 ' + d.label, 'NAME ' + (d.en || d.code), TS);
  cell(tx, tbY + rowH*1.5, '比例 1:1', 'SCALE 1:1', TS);
  cell(tx, tbY + rowH*0.5, dateStr, dateStr, TS);
  var tx2 = tbX + tbW*0.62;
  cell(tx2, tbY + rowH*2.5, '单位 mm', 'UNIT mm', TS);
  cell(tx2, tbY + rowH*1.5, '板厚 t' + params.t, 'T=' + params.t, TS);
  cell(tx2, tbY + rowH*0.5, d.code, d.code, TS);

  /* ---------- 图框 ---------- */
  var bb = sheetBBox(items);
  var pad = FS * 2.2;
  addRect(bb.x0 - pad, bb.y0 - pad, bb.x1 + pad, bb.y1 + pad, 'FRAME', {w: THICK});
  addRect(bb.x0 - pad*0.72, bb.y0 - pad*0.72, bb.x1 + pad*0.72, bb.y1 + pad*0.72, 'FRAME', {w: THIN});

  var full = sheetBBox(items);
  return {
    items: items,
    bbox: full,
    pad: pad*0.35,
    U: U,
    meta: {W:W, D:D, H:H, t:params.t, code:d.code, zh:d.label, en:d.en || d.code, date:dateStr}
  };
}

function sheetBBox(items){
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  function add(x, y){
    if(x < x0) x0 = x; if(x > x1) x1 = x;
    if(y < y0) y0 = y; if(y > y1) y1 = y;
  }
  items.forEach(function(it){
    if(it.t === 'line'){ add(it.x1, it.y1); add(it.x2, it.y2); }
    else if(it.t === 'rect'){ add(it.x0, it.y0); add(it.x1, it.y1); }
    else if(it.t === 'tri'){ it.pts.forEach(function(p){ add(p[0], p[1]); }); }
    else if(it.t === 'text'){
      var w = it.s.length * it.h * 0.66;
      if(it.rot){
        add(it.x - it.h*0.55, it.y - w/2);
        add(it.x + it.h*0.55, it.y + w/2);
      } else if(it.align === 'center'){
        add(it.x - w/2, it.y - it.h*0.55);
        add(it.x + w/2, it.y + it.h*0.65);
      } else {
        add(it.x, it.y - it.h*0.55);
        add(it.x + w, it.y + it.h*0.65);
      }
    }
  });
  return {x0:x0, y0:y0, x1:x1, y1:y1};
}

/* ---------- 输出 SVG ---------- */
function renderSheet(sh){
  var svg = document.getElementById('cadSvg');
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  var b = sh.bbox, pad = sh.pad;
  svg.setAttribute('viewBox',
    (b.x0 - pad) + ' ' + (-(b.y1 + pad)) + ' ' + ((b.x1 - b.x0) + pad*2) + ' ' + ((b.y1 - b.y0) + pad*2));

  var g = el('g');
  svg.appendChild(g);

  function sw(w){ return (w / sh.U * 1400).toFixed(2); }

  sh.items.forEach(function(it){
    if(it.t === 'line'){
      g.appendChild(el('line', {
        x1: it.x1, y1: -it.y1, x2: it.x2, y2: -it.y2,
        stroke: strokeOf(it.layer), 'stroke-width': sw(it.w),
        'stroke-dasharray': it.layer === 'HIDDEN' ? '4 3' : 'none',
        'vector-effect': 'non-scaling-stroke'
      }));
    } else if(it.t === 'rect'){
      g.appendChild(el('rect', {
        x: it.x0, y: -it.y1, width: Math.max(0.05, it.x1 - it.x0), height: Math.max(0.05, it.y1 - it.y0),
        fill: it.fill ? '#ffffff' : 'none',
        stroke: strokeOf(it.layer), 'stroke-width': sw(it.w),
        'stroke-dasharray': it.dash ? '4 3' : 'none',
        'vector-effect': 'non-scaling-stroke'
      }));
    } else if(it.t === 'tri'){
      g.appendChild(el('polygon', {
        points: it.pts.map(function(p){ return p[0] + ',' + (-p[1]); }).join(' '),
        fill: '#1f2937'
      }));
    } else if(it.t === 'text'){
      var t = el('text', {
        x: it.x, y: -it.y, 'font-size': it.h, fill: it.layer === 'DIM' ? '#1f2937' : '#1f2937',
        'font-family': '"Segoe UI","Microsoft YaHei",sans-serif',
        'text-anchor': it.align === 'center' ? 'middle' : 'start',
        'dominant-baseline': 'middle'
      }, it.s);
      if(it.rot) t.setAttribute('transform', 'rotate(-90 ' + it.x + ' ' + (-it.y) + ')');
      g.appendChild(t);
    }
  });
  return svg;
}

function strokeOf(layer){
  if(layer === 'GLASS') return '#5b8ea3';
  if(layer === 'DIM') return '#1f2937';
  if(layer === 'HIDDEN') return '#94a3b8';
  return '#1f2937';
}

function buildCAD(){
  SHEET = buildSheet();
  renderSheet(SHEET);
}

/* ---------- 输出 DXF（R12 / AC1009，桌面 CAD 直接打开） ---------- */
function dxfNum(n){
  var v = Math.round(n * 1000) / 1000;
  return (Math.abs(v) < 0.0005 ? 0 : v).toFixed(3);
}

function sheetToDXF(sh){
  var o = [];
  function p(c, v){ o.push(String(c)); o.push(String(v)); }

  var b = sh.bbox, m = sh.pad * 2;

  /* HEADER */
  p(0,'SECTION'); p(2,'HEADER');
  p(9,'$ACADVER'); p(1,'AC1009');
  p(9,'$INSUNITS'); p(70,4);          /* 4 = 毫米 */
  p(9,'$MEASUREMENT'); p(70,1);
  p(9,'$EXTMIN'); p(10,dxfNum(b.x0-m)); p(20,dxfNum(b.y0-m)); p(30,'0.0');
  p(9,'$EXTMAX'); p(10,dxfNum(b.x1+m)); p(20,dxfNum(b.y1+m)); p(30,'0.0');
  p(0,'ENDSEC');

  /* TABLES */
  p(0,'SECTION'); p(2,'TABLES');

  p(0,'TABLE'); p(2,'LTYPE'); p(70,2);
  p(0,'LTYPE'); p(2,'CONTINUOUS'); p(70,0); p(3,'Solid line'); p(72,65); p(73,0); p(40,'0.0');
  p(0,'LTYPE'); p(2,'DASHED'); p(70,0); p(3,'Dashed __ __ __'); p(72,65); p(73,2); p(40,'0.75');
  p(49,'0.5'); p(49,'-0.25');
  p(0,'ENDTAB');

  var layers = [
    ['0',7,'CONTINUOUS'], ['OUTLINE',7,'CONTINUOUS'], ['THIN',8,'CONTINUOUS'],
    ['GLASS',4,'CONTINUOUS'], ['HIDDEN',8,'DASHED'], ['DIM',1,'CONTINUOUS'],
    ['TEXT',3,'CONTINUOUS'], ['FRAME',7,'CONTINUOUS']
  ];
  p(0,'TABLE'); p(2,'LAYER'); p(70,layers.length);
  layers.forEach(function(l){
    p(0,'LAYER'); p(2,l[0]); p(70,0); p(62,l[1]); p(6,l[2]);
  });
  p(0,'ENDTAB');

  p(0,'TABLE'); p(2,'STYLE'); p(70,1);
  p(0,'STYLE'); p(2,'STANDARD'); p(70,0); p(40,'0.0'); p(41,'1.0'); p(50,'0.0');
  p(71,0); p(42,'2.5'); p(3,'txt.shx'); p(4,'gbcbig.shx');
  p(0,'ENDTAB');

  p(0,'ENDSEC');

  /* ENTITIES */
  p(0,'SECTION'); p(2,'ENTITIES');
  sh.items.forEach(function(it){
    if(it.t === 'line'){
      p(0,'LINE'); p(8,it.layer);
      p(10,dxfNum(it.x1)); p(20,dxfNum(it.y1)); p(30,'0.0');
      p(11,dxfNum(it.x2)); p(21,dxfNum(it.y2)); p(31,'0.0');
    } else if(it.t === 'rect'){
      var lay = it.dash ? 'HIDDEN' : it.layer;
      [[it.x0,it.y0,it.x1,it.y0],[it.x1,it.y0,it.x1,it.y1],
       [it.x1,it.y1,it.x0,it.y1],[it.x0,it.y1,it.x0,it.y0]].forEach(function(q){
        p(0,'LINE'); p(8,lay);
        p(10,dxfNum(q[0])); p(20,dxfNum(q[1])); p(30,'0.0');
        p(11,dxfNum(q[2])); p(21,dxfNum(q[3])); p(31,'0.0');
      });
    } else if(it.t === 'tri'){
      p(0,'POLYLINE'); p(8,it.layer); p(66,1); p(70,1);
      it.pts.forEach(function(pt){
        p(0,'VERTEX'); p(8,it.layer);
        p(10,dxfNum(pt[0])); p(20,dxfNum(pt[1])); p(30,'0.0');
      });
      p(0,'SEQEND');
    } else if(it.t === 'text'){
      var s = it.sa || '';
      if(!/^[\x20-\x7E]*$/.test(s) || !s) s = '';
      if(!s) return;                       /* 非 ASCII 一律不写，避免 CAD 里变乱码 */
      var ty = it.y - it.h * 0.35;
      p(0,'TEXT'); p(8,it.layer);
      p(10,dxfNum(it.x)); p(20,dxfNum(ty)); p(30,'0.0');
      p(40,dxfNum(it.h)); p(1,s);
      if(it.align === 'center'){ p(72,1); p(11,dxfNum(it.x)); p(21,dxfNum(ty)); p(31,'0.0'); }
      if(it.rot) p(50,String(it.rot));
    }
  });
  p(0,'ENDSEC');
  p(0,'EOF');

  return o.join('\r\n');
}

/* =========================================================
   6.5 图片识别：丢一张产品图，反推结构类型 / 层数 / 高宽比
   单张图没有深度信息，所以只取「比例 + 结构特征」，
   绝对尺寸由高度基准换算 —— 这是工程上唯一靠谱的用法。
   ========================================================= */
var imgRatio = null;

function analyzeImage(img){
  var maxSide = 560;
  var sc = Math.min(1, maxSide / Math.max(img.width, img.height));
  var w = Math.max(8, Math.round(img.width * sc));
  var h = Math.max(8, Math.round(img.height * sc));
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d', {willReadFrequently:true});
  g.drawImage(img, 0, 0, w, h);
  var d;
  try { d = g.getImageData(0, 0, w, h).data; } catch(e){ return null; }

  /* 背景色：四角取样取中位数 */
  var samples = [];
  [[0,0],[w-10,0],[0,h-10],[w-10,h-10]].forEach(function(p){
    for(var yy=0; yy<10; yy++){
      for(var xx=0; xx<10; xx++){
        var X = Math.min(w-1, Math.max(0, p[0]+xx)), Y = Math.min(h-1, Math.max(0, p[1]+yy));
        var i = (Y*w + X) * 4;
        samples.push([d[i], d[i+1], d[i+2]]);
      }
    }
  });
  samples.sort(function(a,b){ return (a[0]+a[1]+a[2]) - (b[0]+b[1]+b[2]); });
  var bg = samples[Math.floor(samples.length/2)] || [255,255,255];

  /* 前景掩码 + 包围盒 */
  var mask = new Uint8Array(w*h);
  var minX = w, maxX = -1, minY = h, maxY = -1, fg = 0;
  for(var y=0; y<h; y++){
    for(var x=0; x<w; x++){
      var i2 = (y*w + x) * 4;
      if(d[i2+3] < 20) continue;
      var dr = d[i2] - bg[0], dg = d[i2+1] - bg[1], db = d[i2+2] - bg[2];
      if(Math.sqrt(dr*dr + dg*dg + db*db) > 34){
        mask[y*w + x] = 1; fg++;
        if(x < minX) minX = x;
        if(x > maxX) maxX = x;
        if(y < minY) minY = y;
        if(y > maxY) maxY = y;
      }
    }
  }
  if(fg < w*h*0.015 || maxX < 0) return null;

  var bw = maxX - minX + 1, bh = maxY - minY + 1;
  if(bw < 12 || bh < 12) return null;
  var fill = fg / (bw * bh);

  /* 逐行前景宽度：层板是横向通长，会形成宽度峰值 */
  var counts = [];
  for(var y2=minY; y2<=maxY; y2++){
    var n = 0;
    for(var x2=minX; x2<=maxX; x2++) if(mask[y2*w + x2]) n++;
    counts.push(n);
  }
  var sm = counts.map(function(v, idx){
    var s = 0, k2 = 0;
    for(var k=-2; k<=2; k++){
      var j = idx + k;
      if(j >= 0 && j < counts.length){ s += counts[j]; k2++; }
    }
    return s / k2;
  });
  var maxC = Math.max.apply(null, sm) || 1;
  var th = maxC * 0.86;
  var segs = [], inSeg = false, start = 0;
  for(var m=0; m<sm.length; m++){
    var on = sm[m] >= th;
    if(on && !inSeg){ inSeg = true; start = m; }
    if((!on || m === sm.length-1) && inSeg){
      inSeg = false;
      segs.push((start + m) / 2);
    }
  }
  var merged = [];
  segs.forEach(function(s){
    if(merged.length && Math.abs(s - merged[merged.length-1]) < bh*0.025) return;
    merged.push(s);
  });

  /* 结构判断：宽扁 → 台；实心 → 柜；镂空 → 架 */
  var ratio = bw / bh;
  var type = 'rack';
  if(ratio > 1.35) type = 'table';
  else if(fill >= 0.66) type = 'cabinet';
  else type = 'rack';

  var layers = clamp(merged.length, 1, 8);
  if(fill >= 0.66) layers = clamp(layers, 2, 6);   /* 实心体不要被误判成几十层 */
  if(type === 'rack' && layers >= 3) layers -= 1;  /* 最底那条通长线是底座，不算层板 */

  var edge = (minX < 2 || minY < 2 || maxX > w-3 || maxY > h-3);

  return {type:type, ratio:ratio, layers:layers, fill:fill, edge:edge, bw:bw, bh:bh};
}

function applyImageResult(r){
  var d = TYPES[r.type];
  imgRatio = r.ratio;
  params.type = r.type;
  params.H = clamp(round5(d.defH), 100, 4000);
  params.W = clamp(round5(params.H * r.ratio), 120, 6000);
  params.D = clamp(round5(params.W * 0.62), 80, 3000);
  params.layers = clamp(r.layers, 1, 8);
  params.t = params.t || 15;
  syncInputs();
  generate();
}

function handleImageFile(file){
  if(!file || !/^image\//.test(file.type)) return;
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function(){
    var dz = $('dz'), pre = $('dzPreview'), note = $('dzNote');
    pre.src = url;
    dz.classList.add('hasimg');
    var r = null;
    try { r = analyzeImage(img); } catch(e){ r = null; }
    if(!r){
      note.innerHTML = '<em>没认出轮廓</em>：请换白底产品图，或直接填参数';
      return;
    }
    applyImageResult(r);
    note.innerHTML = '识别 <em>' + TYPES[r.type].label + '</em> · ' + params.layers +
      ' 层 · 高宽比 ' + r.ratio.toFixed(2) + ' · H' + params.H + ' / W' + params.W +
      (r.edge ? ' · 图片贴边，建议留白' : '');
  };
  img.onerror = function(){
    $('dzNote').innerHTML = '<em>图片读不了</em>：换个格式试试';
  };
  img.src = url;
}

/* 一句话 */
function runSentence(){
  var text = $('q').value.trim();
  if(!text) return;
  var p = parseSentence(text);
  params.type = p.type;
  params.W = p.W; params.D = p.D; params.H = p.H;
  params.layers = p.layers; params.t = p.t;
  syncInputs();
  generate();
}

/* 参数面板 */
function readInputs(ev){
  var fromId = ev && ev.target ? ev.target.id : '';
  params.type = $('pType').value;
  params.D = clamp(round5(+$('pD').value || 300), 80, 3000);
  params.H = clamp(round5(+$('pH').value || 600), 100, 4000);
  params.layers = clamp(Math.round(+$('pLayers').value || 1), 1, 8);
  params.t = clamp(round5(+$('pT').value || 15), 5, 40);
  if(fromId === 'pH' && imgRatio){
    /* 图给比例、你给高度 —— 宽度自动跟着走 */
    params.W = clamp(round5(params.H * imgRatio), 120, 6000);
    $('pW').value = params.W;
  } else {
    params.W = clamp(round5(+$('pW').value || TYPES[params.type].defW), 120, 6000);
  }
  generate();
}

/* 示例 */
var EXAMPLES = [
  '三层亚克力展示架，宽600，深400，高1500',
  '亚克力展柜 900×500×1800，两层，板厚20',
  '亚克力展示台，宽1200，深600，高900，板厚25',
  '亚克力陈列盒 400×300×250，分四格',
  '亚克力灯箱，宽800，高600，深120，板厚15'
];

function fillChips(){
  var wrap = $('chips');
  EXAMPLES.forEach(function(txt){
    var b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = txt;
    b.addEventListener('click', function(){
      $('q').value = txt;
      runSentence();
    });
    wrap.appendChild(b);
  });
}

/* 导出 */
function download(name, content, mime){
  var blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
}

function exportSVG(){
  var svg = $('cadSvg').cloneNode(true);
  svg.setAttribute('xmlns', NS);
  svg.setAttribute('width', '1200');
  svg.removeAttribute('style');
  var src = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg);
  var d = TYPES[params.type];
  download('CAD_' + d.code + '_' + params.W + 'x' + params.D + 'x' + params.H + '.svg', src, 'image/svg+xml;charset=utf-8');
}

function exportDXF(){
  if(!SHEET) return;
  var txt = sheetToDXF(SHEET);
  var d = TYPES[params.type];
  download('CAD_' + d.code + '_' + params.W + 'x' + params.D + 'x' + params.H + '.dxf',
           txt, 'application/dxf;charset=utf-8');
  var note = document.getElementById('dxfTip');
  if(note){
    note.textContent = '已导出 ' + params.W + '\u00d7' + params.D + '\u00d7' + params.H +
      ' mm \u00b7 1:1 \u771f\u5b9e\u5c3a\u5bf8 \u00b7 \u53cc\u51fb\u6587\u4ef6\u7528 CAD \u6253\u5f00';
    note.style.display = 'block';
  }
}

function exportPNG(){
  var a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  var d = TYPES[params.type];
  a.download = '3D_' + d.code + '_' + params.W + 'x' + params.D + 'x' + params.H + '.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* 交互：3D 旋转 */
var drag = null;
cv.addEventListener('pointerdown', function(e){
  drag = {x:e.clientX, y:e.clientY};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', function(e){
  if(!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  view.yaw += dx * 0.0095;
  view.pitch = clamp(view.pitch + dy * 0.0075, -1.35, 1.35);
  render3D();
});
cv.addEventListener('pointerup', function(){ drag = null; });
cv.addEventListener('pointercancel', function(){ drag = null; });
cv.addEventListener('wheel', function(e){
  e.preventDefault();
  view.zoom = clamp(view.zoom * (e.deltaY > 0 ? 0.92 : 1.08), 0.45, 3.2);
  render3D();
}, {passive:false});

/* 初始化 */
function init(){
  fillTypeSelect();
  fillChips();
  $('q').value = EXAMPLES[0];

  $('go').addEventListener('click', runSentence);
  $('q').addEventListener('keydown', function(e){ if(e.key === 'Enter') runSentence(); });

  /* 图片：点击 / 拖拽 / 粘贴，三种都能丢进来 */
  var dz = $('dz'), fi = $('fileInput');
  dz.addEventListener('click', function(){ fi.click(); });
  fi.addEventListener('change', function(){
    if(fi.files && fi.files[0]) handleImageFile(fi.files[0]);
    fi.value = '';
  });
  ['dragenter','dragover'].forEach(function(t){
    dz.addEventListener(t, function(e){ e.preventDefault(); dz.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(t){
    dz.addEventListener(t, function(e){ e.preventDefault(); dz.classList.remove('over'); });
  });
  dz.addEventListener('drop', function(e){
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) handleImageFile(f);
  });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('drop', function(e){ e.preventDefault(); });
  document.addEventListener('paste', function(e){
    var items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(var i=0;i<items.length;i++){
      if(items[i].type.indexOf('image') === 0){
        handleImageFile(items[i].getAsFile());
        break;
      }
    }
  });

  ['pType','pW','pD','pH','pLayers','pT'].forEach(function(id){
    $(id).addEventListener('input', readInputs);
    $(id).addEventListener('change', readInputs);
  });

  $('btnReset').addEventListener('click', function(){
    view.yaw = -0.62; view.pitch = 0.30; view.zoom = 1;
    render3D();
  });
  $('btnSpin').addEventListener('click', function(){
    view.spin = !view.spin;
    this.classList.toggle('on', view.spin);
    if(view.spin){ rafId = requestAnimationFrame(spinLoop); }
    else if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  });
  $('btnPng').addEventListener('click', exportPNG);
  $('btnSvg').addEventListener('click', exportSVG);
  $('btnDxf').addEventListener('click', exportDXF);
  $('btnPrint').addEventListener('click', function(){ window.print(); });

  var ro = new ResizeObserver(function(){ render3D(); });
  ro.observe(cv);

  runSentence();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
